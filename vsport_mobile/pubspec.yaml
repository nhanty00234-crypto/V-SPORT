name: vsport_mobile
description: Ứng dụng khách hàng V-SPORT (Flutter) — gọi REST API /api/v1 của backend Java hiện có.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  flutter_secure_storage: ^9.2.2
  # Quét QR dán tại sân
  mobile_scanner: ^5.2.3
  # Render payload VietQR mà backend trả về thành ảnh QR (payload do PayOS sinh phía server)
  qr_flutter: ^4.1.0
  # Lấy vị trí để tìm cơ sở gần nhất
  geolocator: ^12.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
