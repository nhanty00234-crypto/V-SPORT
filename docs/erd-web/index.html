NVARCHAR(500)", "pk": false, "fk": false, "null": true, "ref": "", "uq": false, "ident": false, "comp": false, "def": "", "desc": ""}, {"n": "ViTriYeuThich", "vn": "ViTriYeuThich", "t": "NVARCHAR(255)", "pk": false, "fk": false, "null": true, "ref": "", "uq": false, "ident": false, "comp": false, "def": "", "desc": ""}, {"n": "MonTheThaoYeuThichID", "vn": "mã MonTheThaoYeuThich", "t": "INT", "pk": false, "fk": true, "null": true, "ref": "MonTheThao", "uq": false, "ident": false, "comp": false, "def": "", "desc": ""}, {"n": "TrinhDoChoi", "vn": "TrinhDoChoi", "t": "VARCHAR(30)", "pk": false, "fk": false, "null": true, "ref": "", "uq": false, "ident": false, "comp": false, "def": "", "desc": ""}, {"n": "MucTieuChoi", "vn": "MucTieuChoi", "t": "NVARCHAR(255)", "pk": false, "fk": false, "null": true, "ref": "", "uq": false, "ident": false, "comp": false, "def": "", "desc": ""}, {"n": "TanSuatChoi", "vn": "TanSuatChoi", "t": "VARCHAR(30)", "pk": false, "fk": false, "null": true, "ref": "", "uq": false, "ident": false, "comp": false, "def": "", "desc": ""}, {"n": "QrImagePath", "vn": "Ảnh QR nhận lương", "t": "NVARCHAR(500)", "pk": false, "fk": false, "null": true, "ref": "", "uq": false, "ident": false, "comp": false, "def": "", "desc": ""}]}], "edges": [{"f": "SuCo", "fc": "BaoVeID", "t": "Accounts", "tc": "AccountID", "name": "fk_suco_baove", "card": "1..N → 1", "label": "Tài khoản 1–N Sự cố", "opt": false, "cross": true, "src": "MIGRATION_SQL", "unver": false}, {"f": "SuCo", "fc": "CoSoID", "t": "CoSo", "tc": "CoSoID", "name": "fk_suco_coso", "card": "1..N → 1", "label": "Cơ sở thể thao 1–N Sự cố", "opt": false, "cross": true, "src": "MIGRATION_SQL", "unver": false}]}, {"id": "G99", "order": 99, "title": "Bảng hệ thống", "sub": "Không thuộc nghiệp vụ", "desc": "Bao gồm bảng: sysdiagrams. Đây là bảng do SQL Server Management Studio sinh ra để lưu sơ đồ, không thuộc nghiệp vụ V-SPORT và không cần vẽ trong ERD.", "tables": [{"name": "sysdiagrams", "vn": "Sơ đồ hệ thống (SSMS)", "central": true, "pos": "CENTER", "full": true, "cols": [{"n": "name", "vn": "name", "t": "NVARCHAR(128)", "pk": false, "fk": false, "null": false, "ref": "", "uq": false, "ident": false, "comp": false, "def": "", "desc": ""}, {"n": "principal_id", "vn": "principal_id", "t": "INT", "pk": false, "fk": false, "null": false, "ref": "", "uq": false, "ident": false, "comp": false, "def": "", "desc": ""}, {"n": "diagram_id", "vn": "diagram_id", "t": "INT", "pk": true, "fk": false, "null": false, "ref": "", "uq": true, "ident": false, "comp": false, "def": "", "desc": ""}, {"n": "version", "vn": "version", "t": "INT", "pk": false, "fk": false, "null": true, "ref": "", "uq": false, "ident": false, "comp": false, "def": "", "desc": ""}, {"n": "definition", "vn": "definition", "t": "VARBINARY(MAX)", "pk": false, "fk": false, "null": true, "ref": "", "uq": false, "ident": false, "comp": false, "def": "", "desc": ""}]}], "edges": []}], "stats": {"tables": 68, "cols": 791, "fks": 137, "groups": 26}}</script>
<script>
const DATA = JSON.parse(document.getElementById('erd-data').textContent);
const PAL = ['#2563eb','#0f766e','#b45309','#7c3aed','#be123c','#0891b2','#4d7c0f','#c2410c'];
const main = document.getElementById('main'), chips = document.getElementById('chips');

document.getElementById('stats').innerHTML = [
  [DATA.stats.groups,'nhóm ERD'],[DATA.stats.tables,'bảng'],
  [DATA.stats.cols,'cột'],[DATA.stats.fks,'khóa ngoại']
].map(([v,l])=>`<div class="stat"><b>${v}</b><i>${l}</i></div>`).join('');
document.getElementById('cnt').textContent =
  `${DATA.stats.groups} nhóm · ${DATA.stats.tables} bảng · ${DATA.stats.fks} FK`;

const esc = s => (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function colHtml(c){
  const cls = c.pk ? 'pk' : (c.fk ? 'fk' : '');
  const key = c.pk ? '◆' : (c.fk ? '◇' : '');
  const flags = [c.ident&&'IDENTITY', c.comp&&'computed', !c.null&&!c.pk&&'NOT NULL',
                 c.uq&&!c.pk&&'UNIQUE'].filter(Boolean).join(' · ');
  const title = [c.vn, c.ref&&('→ '+c.ref), flags, c.desc].filter(Boolean).join(' | ');
  return `<div class="col ${cls}" data-col="${esc(c.n)}" title="${esc(title)}"><span class="k">${key}</span>
    <span class="nm">${esc(c.n)}</span><span class="ty">${esc(c.t)}</span></div>`;
}

function tblHtml(t){
  const keys = t.cols.filter(c=>c.pk||c.fk).length;
  const rest = t.cols.length - keys;
  const n = t.cols.length;
  const split = n>28 ? 3 : (n>12 ? 2 : 1);
  return `<div class="tbl ${t.central?'central':''}" data-split="${split}" data-table="${esc(t.name)}">
    <div class="th" title="Bấm để thu/mở bảng này">${esc(t.name)}
      <small>${esc(t.vn)} · ${t.cols.length} cột · ${keys} khóa</small></div>
    <div class="tbody">${t.cols.map(colHtml).join('')}
      ${rest?`<div class="more">+ ${rest} cột khác</div>`:''}</div></div>`;
}

function order(tables){
  const rank = {LEFT:0, CENTER:1, RIGHT:2, TOP:1, BOTTOM:1};
  return tables.slice().sort((a,b)=>(rank[a.pos]??1)-(rank[b.pos]??1));
}

main.innerHTML = DATA.groups.map((g,i)=>{
  const c = PAL[i%PAL.length];
  const rels = g.edges.length ? `<div class="rels"><div class="relbox">
    <div class="relhead"><h4>Quan hệ (${g.edges.length})</h4>
      <div class="relbtns">
        <button class="cp" data-g="${g.id}" data-fmt="simple">Sao chép (gọn)</button>
        <button class="cp" data-g="${g.id}" data-fmt="text">Sao chép (chi tiết)</button>
        <button class="cp" data-g="${g.id}" data-fmt="md">Sao chép bảng Markdown</button>
      </div></div>${
    g.edges.map(e=>`<div class="rel">
      <span class="simple">${esc(e.label)}</span>
      <span class="full"><code>${esc(e.f)}.${esc(e.fc)}</code> →
      <code>${esc(e.t)}.${esc(e.tc)}</code>
      <span class="tag">${esc(e.card)}</span>
      <span class="tag">${e.opt?'tùy chọn':'bắt buộc'}</span>
      ${e.cross?'<span class="tag cross">liên nhóm</span>':''}
      ${e.unver?'<span class="tag warn" title="Chỉ có trong migration SQL, chưa xác minh trên DB thật">⚠ chưa xác minh</span>':''}
      <span class="tag" title="Nguồn dữ liệu">${esc(e.src)}</span>
      <span style="color:var(--muted)">${esc(e.label)}</span></span></div>`).join('')}
    </div></div>` : '';
  return `<section class="group" id="${g.id}" style="--gc:${c}">
    <div class="ghead"><h3 class="gtitle"><span class="gid">${g.id}</span>${esc(g.title)}
      <small>${esc(g.sub)} · ${g.tables.length} bảng</small></h3></div>
    <div class="gdesc">${esc(g.desc)}</div>
    <div class="canvas"><svg></svg><div class="row">${order(g.tables).map(tblHtml).join('')}</div></div>
    ${rels}</section>`;
}).join('');

chips.innerHTML = DATA.groups.map((g,i)=>
  `<span class="chip" data-g="${g.id}" style="--gc:${PAL[i%PAL.length]}">${g.id} · ${esc(g.title)}</span>`).join('');

/* ---- lọc theo nhóm ---- */
let active = null;
chips.addEventListener('click', ev=>{
  const chip = ev.target.closest('.chip'); if(!chip) return;
  active = active===chip.dataset.g ? null : chip.dataset.g;
  applyFilter();
});
document.getElementById('all').onclick = ()=>{ active=null; applyFilter(); };

function applyFilter(){
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', c.dataset.g===active));
  document.getElementById('all').classList.toggle('on', !active);
  document.querySelectorAll('.group').forEach(s=>s.classList.toggle('hide', !!active && s.id!==active));
  if(active) document.getElementById(active).scrollIntoView({behavior:'smooth',block:'start'});
  requestAnimationFrame(draw);
}

/* ---- tìm kiếm ---- */
document.getElementById('q').addEventListener('input', e=>{
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('.tbl').forEach(t=>{
    if(!q){ t.classList.remove('dim','hit'); return; }
    const hit = t.textContent.toLowerCase().includes(q);
    t.classList.toggle('hit', hit); t.classList.toggle('dim', !hit);
  });
});

/* ---- mật độ cột / thu gọn bảng / theme ---- */
const dens = document.getElementById('density');
dens.onchange = ()=>{ document.body.dataset.density = dens.value; requestAnimationFrame(draw); };
document.body.dataset.density = dens.value;

const relmode = document.getElementById('relmode');
relmode.onchange = ()=>{ document.body.dataset.rel = relmode.value; };
document.body.dataset.rel = relmode.value;

let collapsed=false;
document.getElementById('collapse').onclick = e=>{
  collapsed=!collapsed;
  document.querySelectorAll('.tbl').forEach(t=>t.classList.toggle('folded', collapsed));
  e.target.textContent = collapsed?'Mở tất cả bảng':'Thu gọn tất cả bảng';
  e.target.classList.toggle('on', collapsed);
  requestAnimationFrame(draw);
};
main.addEventListener('click', ev=>{
  const th = ev.target.closest('.th'); if(!th) return;
  th.parentElement.classList.toggle('folded');
  requestAnimationFrame(draw);
});
document.getElementById('theme').onclick = e=>{
  const light = document.documentElement.dataset.theme==='light';
  document.documentElement.dataset.theme = light?'dark':'light';
  e.target.textContent = light?'Nền sáng':'Nền tối';
};

/* ---- sao chép danh sách quan hệ ---- */
function relText(g, fmt){
  const rows = g.edges.map(e=>[
    `${e.f}.${e.fc}`, `${e.t}.${e.tc}`, e.card,
    e.opt?'tùy chọn':'bắt buộc', e.cross?'liên nhóm':'trong nhóm', e.label]);
  if(fmt==='simple'){
    const seen=new Set();
    const lines=g.edges.map(e=>e.label).filter(l=>l && !seen.has(l) && seen.add(l));
    return [`${g.title}`, ...lines.map(l=>'• '+l)].join('\n');
  }
  if(fmt==='md'){
    const head = ['Từ (bảng.cột)','Đến (bảng.cột)','Lực lượng','Ràng buộc','Phạm vi','Ý nghĩa'];
    return [`### ${g.id} — ${g.title} (${g.edges.length} quan hệ)`, '',
      '| '+head.join(' | ')+' |', '|'+head.map(()=>'---').join('|')+'|',
      ...rows.map(r=>'| '+r.join(' | ')+' |')].join('\n');
  }
  return [`${g.id} — ${g.title} (${g.edges.length} quan hệ)`,
    ...rows.map(r=>`- ${r[0]} -> ${r[1]}  (${r[2]}, ${r[3]}, ${r[4]})  ${r[5]}`)].join('\n');
}
async function copyText(txt){
  try { await navigator.clipboard.writeText(txt); return true; }
  catch(_){
    const ta=document.createElement('textarea');
    ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    const ok=document.execCommand('copy'); ta.remove(); return ok;
  }
}
main.addEventListener('click', async ev=>{
  const btn = ev.target.closest('.cp'); if(!btn) return;
  const g = DATA.groups.find(x=>x.id===btn.dataset.g);
  const ok = await copyText(relText(g, btn.dataset.fmt));
  const old = btn.textContent;
  btn.textContent = ok?'✓ Đã sao chép':'✕ Không sao chép được';
  btn.classList.toggle('ok', ok);
  setTimeout(()=>{ btn.textContent=old; btn.classList.remove('ok'); }, 1600);
});

/* ---- vẽ đường nối giữa các bảng ---- */
function draw(){
  DATA.groups.forEach(g=>{
    const sec = document.getElementById(g.id); if(!sec || sec.classList.contains('hide')) return;
    const canvas = sec.querySelector('.canvas'), svg = canvas.querySelector('svg');
    const cb = canvas.getBoundingClientRect();
    svg.setAttribute('viewBox', `0 0 ${cb.width} ${cb.height}`);
    /* neo vào đúng dòng cột nếu dòng đó đang hiện, nếu không thì neo giữa thẻ */
    const box = (n, col) => {
      const el = canvas.querySelector(`.tbl[data-table="${n}"]`); if(!el) return null;
      const r = el.getBoundingClientRect();
      const o = {l:r.left-cb.left, r:r.right-cb.left, t:r.top-cb.top, b:r.bottom-cb.top,
                 cx:r.left-cb.left+r.width/2, cy:r.top-cb.top+r.height/2};
      const cel = col && el.querySelector(`.col[data-col="${col}"]`);
      if(cel && cel.offsetParent){
        const cr = cel.getBoundingClientRect();
        const y = cr.top-cb.top+cr.height/2;
        if(y >= o.t && y <= o.b) o.cy = y;
      }
      return o;
    };
    svg.innerHTML = g.edges.map(e=>{
      const a = box(e.f, e.fc), b = box(e.t, e.tc); if(!a||!b) return '';
      let x1,y1,x2,y2;
      if(Math.abs(a.cx-b.cx) > 40){
        const left = a.cx < b.cx;
        x1 = left?a.r:a.l; x2 = left?b.l:b.r; y1=a.cy; y2=b.cy;
      } else { x1=a.cx; x2=b.cx; y1 = a.cy<b.cy?a.b:a.t; y2 = a.cy<b.cy?b.t:b.b; }
      const mx=(x1+x2)/2;
      return `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"
        fill="none" stroke="var(--edge)" stroke-width="1.8"
        stroke-dasharray="${e.opt?'6 4':'0'}"/>
        <circle cx="${x2}" cy="${y2}" r="3.5" fill="var(--edge)"/>`;
    }).join('');
  });
}
window.addEventListener('resize', draw);
requestAnimationFrame(draw);
</script>
</body>
</html>
