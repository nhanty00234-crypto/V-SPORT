<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>V-SPORT Entity-Relationship Diagram</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <div class="header-logo">
      <img src="assets/logo.png" alt="V-SPORT logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';" />
      <span class="wordmark" style="display:none;">V-SPORT</span>
    </div>
    <div class="header-titles">
      <p class="main-title">ENTITY-RELATIONSHIP DIAGRAM</p>
      <p class="group-title" id="groupTitle">OVERVIEW</p>
    </div>
    <div class="header-mascot"></div>
  </header>

  <nav class="group-nav" aria-label="ERD group navigator">
    <h2>Groups</h2>
    <input type="search" class="search-box" id="tableSearch" placeholder="Search table..." aria-label="Search table" />
    <ul class="nav-list" id="navList">
      <li><button class="nav-item overview-item" data-view="overview">Overview</button></li>
    </ul>
  </nav>

  <div class="main-area">
    <div class="toolbar" role="toolbar" aria-label="ERD controls">
      <button id="prevBtn" aria-label="Previous group">&#8592; Prev</button>
      <button id="nextBtn" aria-label="Next group">Next &#8594;</button>
      <span class="spacer" style="flex:0 0 16px;"></span>
      <button id="zoomOut" aria-label="Zoom out">−</button>
      <span class="zoom-readout" id="zoomReadout">100%</span>
      <button id="zoomIn" aria-label="Zoom in">+</button>
      <button id="fitBtn" aria-label="Fit to canvas">Fit</button>
      <button id="resetZoomBtn" aria-label="Reset zoom">Reset (0)</button>
      <button id="resetLayoutBtn" aria-label="Reset table positions">Reset Layout</button>
      <span class="spacer"></span>
      <button id="screenshotToggle" aria-pressed="false">Screenshot Mode (S)</button>
    </div>

    <div class="screenshot-header" id="screenshotHeader">
      <div class="header-logo">
        <img src="assets/logo.png" alt="V-SPORT logo" onerror="this.style.display='none';" />
      </div>
      <div class="header-titles">
        <p class="main-title">ENTITY-RELATIONSHIP DIAGRAM</p>
        <p class="group-title" id="ssGroupTitle">OVERVIEW</p>
      </div>
      <div class="header-mascot"></div>
    </div>

    <div class="canvas-viewport" id="canvasViewport">
      <div class="canvas-stage" id="canvasStage"></div>
    </div>

    <div class="legend" aria-hidden="true">
      <span class="legend-item"><span class="swatch" style="background:#F59E0B"></span> PK</span>
      <span class="legend-item"><span class="swatch" style="background:#2563EB"></span> FK</span>
      <span class="legend-item"><span class="swatch" style="background:#16A34A"></span> UQ</span>
      <span class="legend-item"><span class="swatch" style="background:#94A3B8"></span> Nullable</span>
      <span class="legend-item"><span class="swatch" style="background:#315B7D"></span> Relationship</span>
      <span class="legend-item">Cardinality shown as 1 / 0..1 / N at each end</span>
    </div>
  </div>
</div>

<script src="erd-data.js"></script>
<script src="app.js"></script>
</body>
</html>
