<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>V-SPORT Sơ Đồ Thực Thể Liên Kết</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <div class="header-logo">
      <img src="assets/logo.png" alt="V-SPORT logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';" />
      <span class="wordmark" style="display:none;">V-SPORT</span>
    </div>
    <div class="header-titles">
      <p class="main-title">SƠ ĐỒ THỰC THỂ LIÊN KẾT</p>
      <p class="group-title" id="groupTitle">TỔNG QUAN</p>
    </div>
    <div class="header-mascot"></div>
  </header>

  <nav class="group-nav" aria-label="Điều hướng nhóm ERD">
    <h2>Nhóm sơ đồ</h2>
    <input type="search" class="search-box" id="tableSearch" placeholder="Tìm bảng..." aria-label="Tìm bảng" />
    <ul class="nav-list" id="navList">
      <li><button class="nav-item overview-item" data-view="overview">Tổng quan</button></li>
    </ul>
  </nav>

  <div class="main-area">
    <div class="toolbar" role="toolbar" aria-label="Điều khiển ERD">
      <button id="prevBtn" aria-label="Nhóm trước">&#8592; Trước</button>
      <button id="nextBtn" aria-label="Nhóm sau">Sau &#8594;</button>
      <span class="spacer" style="flex:0 0 16px;"></span>
      <button id="zoomOut" aria-label="Thu nhỏ">−</button>
      <span class="zoom-readout" id="zoomReadout">100%</span>
      <button id="zoomIn" aria-label="Phóng to">+</button>
      <button id="fitBtn" aria-label="Vừa khung">Vừa khung</button>
      <button id="resetZoomBtn" aria-label="Đặt lại độ phóng">Đặt lại (0)</button>
      <button id="resetLayoutBtn" aria-label="Đặt lại vị trí bảng">Đặt lại bố cục</button>
      <span class="spacer"></span>
      <button id="screenshotToggle" aria-pressed="false">Chế độ chụp màn hình (S)</button>
    </div>

    <div class="screenshot-header" id="screenshotHeader">
      <div class="header-logo">
        <img src="assets/logo.png" alt="Logo V-SPORT" onerror="this.style.display='none';" />
      </div>
      <div class="header-titles">
        <p class="main-title">SƠ ĐỒ THỰC THỂ LIÊN KẾT</p>
        <p class="group-title" id="ssGroupTitle">TỔNG QUAN</p>
      </div>
      <div class="header-mascot"></div>
    </div>

    <div class="canvas-viewport" id="canvasViewport">
      <div class="canvas-stage" id="canvasStage"></div>
    </div>

    <div class="legend" aria-hidden="true">
      <span class="legend-item"><span class="swatch" style="background:#F59E0B"></span> PK (Khóa chính)</span>
      <span class="legend-item"><span class="swatch" style="background:#2563EB"></span> FK (Khóa ngoại)</span>
      <span class="legend-item"><span class="swatch" style="background:#16A34A"></span> UQ (Duy nhất)</span>
      <span class="legend-item"><span class="swatch" style="background:#94A3B8"></span> Nullable (Có thể trống)</span>
      <span class="legend-item"><span class="swatch" style="background:#315B7D"></span> Quan hệ</span>
      <span class="legend-item">Bậc số lượng hiển thị dạng 1 / 0..1 / N ở mỗi đầu</span>
    </div>
  </div>
</div>

<script src="erd-data.js"></script>
<script src="app.js"></script>
</body>
</html>
